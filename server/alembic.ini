# Alembic configuration (ARCHITECTURE section 2/7 T3)
# NOTE: keep this file ASCII-only (configparser reads with locale encoding on Windows).
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# migration file template: 0001_init.py (4-digit serial_slug)
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url is read from settings.database_url in alembic/env.py (env-injected)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
