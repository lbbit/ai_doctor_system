# api（无状态，可水平扩；initContainer 等待 DB 就绪，§12.2）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ai-doctor
  labels: { app: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting-for-db; sleep 2; done"]
      containers:
        - name: api
          image: ai-doctor-server:latest
          command: ["./entrypoint.sh", "python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: ai-doctor-config }
            - secretRef: { name: ai-doctor-secret }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ai-doctor
spec:
  selector: { app: api }
  ports:
    - port: 8000
      targetPort: 8000
