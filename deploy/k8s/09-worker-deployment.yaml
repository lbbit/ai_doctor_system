# worker（预处理队列，可独立扩缩；同镜像不同入口）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ai-doctor
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting-for-db; sleep 2; done"]
      containers:
        - name: worker
          image: ai-doctor-server:latest
          command: ["./entrypoint.sh", "python", "-m", "app.worker"]
          envFrom:
            - configMapRef: { name: ai-doctor-config }
            - secretRef: { name: ai-doctor-secret }
          readinessProbe:
            exec: { command: ["sh", "-c", "python -c \"import redis,os;redis.Redis.from_url(os.environ['REDIS_URL']).ping()\""] }
            periodSeconds: 30
          livenessProbe:
            exec: { command: ["pgrep", "-f", "app.worker"] }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: "250m", memory: "384Mi" }
            limits: { cpu: "1", memory: "768Mi" }
