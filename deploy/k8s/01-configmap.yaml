# 非敏感配置（AC-15.3：镜像零硬编码，全部 env 注入）
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-doctor-config
  namespace: ai-doctor
data:
  APP_ENV: "prod"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  DATABASE_URL: "postgresql+psycopg://aiuser:aipass@postgres:5432/aidoctor"
  REDIS_URL: "redis://redis:6379/0"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "medical-docs"
  MINIO_SECURE: "false"
  JWT_ALG: "HS256"
  JWT_EXPIRE_MINUTES: "10080"
  LLM_BASE_URL: "https://api.openai.com/v1"
  LLM_MODEL: "gpt-4o-mini"
  LLM_VLM_MODEL: "gpt-4o"
  LLM_TIMEOUT_SECONDS: "60"
  LLM_MAX_RETRIES: "1"
  LOCAL_MODEL_MODE: "false"
  PII_MASKING_ENABLED: "true"
  HITL_CONFIDENCE_THRESHOLD: "0.85"
  AUTO_COMMIT_ENABLED: "false"
  MAX_UPLOAD_MB: "20"
  EXTRACT_MAX_ATTEMPTS: "2"
  QUEUE_EXTRACT: "queue:extract"
  SIGN_URL_EXPIRE_SECONDS: "600"
  REDFLAG_RELOAD_TTL_SECONDS: "60"
  CORS_ORIGINS: "https://ai-doctor.example.com"
  RATE_LIMIT_CHAT_PER_MIN: "20"
  VITE_API_BASE: "/api"
