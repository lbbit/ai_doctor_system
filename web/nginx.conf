# AI 私人医生 — nginx 配置（静态 SPA + /api 反代 + SSE 支持）
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 关键：nginx 默认只在启动时解析 upstream 主机名并永久缓存 IP。
    # 容器重建（docker compose up -d --build / 滚动发布）后 api 的 IP 会变，
    # nginx 仍连旧 IP → 所有 /api 请求 502（实测：登录直接报"服务器内部错误"）。
    # 用 Docker 内置 DNS + 变量式 proxy_pass 强制运行时解析。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 25m;   # 上传直走 /api，静态不限；稍大于 20MB 上限

    # web 容器自身健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 静态资源长缓存（Vite 产物带 hash）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反向代理（含 SSE：关闭缓冲 + 长超时）
    location /api/ {
        set $api_upstream "api:8000";
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;            # SSE 必需
        proxy_cache off;
        proxy_read_timeout 300s;        # LLM 生成可能较长
        proxy_send_timeout 300s;
        # 上游容器重建中的短暂不可用：重试一次，减少用户可见 502
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # OpenAI 兼容端点
    location /v1/ {
        set $api_upstream "api:8000";
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA  History 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }
}
